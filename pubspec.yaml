name: riding_information_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.1.4
  http: ^1.2.2
  flutter_polyline_points: ^3.1.0
  maplibre_gl: ^0.24.0   # ✅ 최신 버전
  flutter_plugin_android_lifecycle: ^2.0.30
  fl_chart: ^0.70.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/image/
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/font/NotoSansKR-VariableFont_wght.ttf

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/image/icon.png
    background_color: "#22C55E"
    theme_color: "#22C55E"
  windows:
    generate: true
    image_path: assets/image/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/image/icon.png
  image_path: assets/image/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#22C55E"
